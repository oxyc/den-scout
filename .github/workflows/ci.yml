name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # docker-publish.yml calls this as its gate, so a tag cannot publish an image CI would reject.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          # Build golangci-lint from source with this job's Go (1.26) — a prebuilt binary built with an
          # older Go refuses a module whose go directive targets 1.26.
          install-mode: goinstall

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      # Coverage gate on the logic package (mirrors the old vitest ≥90% gate over src/;
      # cmd/den-scout is a thin main() shim that ListenAndServe can't unit-test).
      - name: coverage gate (>=90%)
        run: |
          go test -coverprofile=cover.out ./internal/...
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "internal coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 90) ? 0 : 1 }' || {
            echo "coverage ${pct}% is below the 90% gate"; exit 1;
          }

  # The image is what actually ships (cross-compiled, distroless). Catching a Dockerfile break on the
  # PR rather than at `git tag` time, without pushing, for amd64 — the only arch the box runs. A tag's
  # publish job builds it anyway.
  build-pr:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
